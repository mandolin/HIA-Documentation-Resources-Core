name: Resource Reference Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resource-reference-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate publication identity
        id: snapshot
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          snapshot = json.loads(Path('snapshot.json').read_text())
          assert snapshot['publicationRepository'] == os.environ['EXPECTED_REPOSITORY']
          assert snapshot['repository'] == 'mandolin/HIA-Documentation'
          assert re.fullmatch('[0-9a-f]{40}', snapshot['commit'])
          assert re.fullmatch('resources-(core|applications)-[0-9a-f]{7,40}', snapshot['tag'])
          assert snapshot['asset'] == snapshot['tag'] + '.tar.gz'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + snapshot['commit'] + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: mandolin/HIA-Documentation
          ref: ${{ steps.snapshot.outputs.commit }}
          path: build-owner
          persist-credentials: false
          sparse-checkout: |
            scripts
            reference
      - name: Check archive-validation regressions
        run: python3 -m unittest discover -s build-owner/scripts -p test_resource_reference_publication.py
      - name: Download and validate the pinned resource snapshot
        env:
          PUBLICATION_REPOSITORY: ${{ github.repository }}
        run: |
          tag=$(jq -er .tag snapshot.json)
          asset=$(jq -er .asset snapshot.json)
          curl --fail --silent --show-error --location --proto '=https' --http1.1 --retry 2 --max-time 180 --output "$RUNNER_TEMP/reference.tar.gz" "https://github.com/$PUBLICATION_REPOSITORY/releases/download/$tag/$asset"
          curl --fail --silent --show-error --location --proto '=https' --http1.1 --retry 2 --max-time 120 --output "$RUNNER_TEMP/build-report.json" "https://github.com/$PUBLICATION_REPOSITORY/releases/download/$tag/build-report.json"
          python3 build-owner/scripts/prepare_resource_reference.py snapshot.json "$RUNNER_TEMP/reference.tar.gz" "$RUNNER_TEMP/build-report.json" "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
